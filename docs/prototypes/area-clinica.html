<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HealthManager · Protótipo da área clínica</title>
<style>
:root{--bg:#f8fafc;--ink:#1e293b;--muted:#64748b;--border:#d1d5db;--brand:#4f46e5;--soft:#eef2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;border:1px solid var(--border);border-radius:6px;padding:10px 14px;min-height:44px;color:var(--ink)}button:hover{background:var(--soft)}button:disabled{opacity:.5;cursor:not-allowed}button.primary{background:var(--brand);color:white;border-color:var(--brand)}:focus-visible{outline:3px solid #818cf8;outline-offset:3px}input,select,textarea{padding:10px;border:1px solid var(--border);border-radius:5px;background:white;color:var(--ink);width:100%}textarea{resize:vertical;min-height:100px}label{display:block;font-weight:600;margin:12px 0}label input,label textarea,label select{display:block;margin-top:6px;font-weight:400}h1{font-size:26px;line-height:1.25;margin:4px 0 8px;letter-spacing:-.6px}h2{font-size:17px;margin:0 0 12px}h3{font-size:14px;margin:0 0 6px}p{margin:6px 0 12px}small,.muted{color:var(--muted)}.app{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh}aside{background:#0f172a;color:#cbd5e1;padding:24px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:10px;color:white;padding:0 10px 22px;border-bottom:1px solid #334155}.logo{background:var(--brand);border-radius:6px;padding:8px;font-weight:700}aside small{color:#94a3b8}aside nav{margin-top:22px}aside button{background:transparent;border:0;color:#cbd5e1;width:100%;text-align:left;margin-bottom:3px}aside button:hover,aside button[aria-current=page]{background:#253052;color:#c7d2fe}aside .label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;padding:14px 14px 7px;color:#94a3b8}.profile{padding:20px 10px;border-top:1px solid #334155;margin-top:28px}main{min-width:0;padding:24px 32px;max-width:1600px;width:100%}.notice{font-size:12px;color:#4338ca;border-bottom:1px solid #c7d2fe;padding-bottom:10px;margin-bottom:24px}.top,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:24px}.actions{display:flex;gap:8px;flex-wrap:wrap}.panel{background:white;border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:20px}.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{text-align:left;display:block;padding:20px;min-height:110px}.card strong{display:block;margin-bottom:6px}.card small{display:block}.badge{display:inline-block;border-radius:4px;padding:3px 8px;font-size:12px;background:var(--soft);color:#4338ca}.green{background:#ecfdf5;color:#047857}.amber{background:#fffbeb;color:#92400e}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:20px}.toolbar label{margin:0;min-width:140px;flex:1}.calendar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.column{background:white;border:1px solid var(--border);border-radius:8px;padding:16px;min-width:0}.slot{border-top:1px solid #e2e8f0;margin-top:16px;padding-top:12px;min-height:106px}.appointment{display:block;width:100%;text-align:left;background:#eef2ff;border-color:#c7d2fe;margin-top:7px;padding:10px}.appointment span,.appointment strong{display:block}.appointment small{color:#475569}.simultaneous{display:flex;gap:6px}.simultaneous>*{flex:1;min-width:0;overflow-wrap:anywhere}.unavailable{background:#f1f5f9;color:#64748b;padding:16px;border-radius:5px;margin-top:10px}.timeline{border-left:2px solid #e2e8f0;margin-left:5px;padding-left:22px}.event{position:relative;padding-bottom:24px}.event:before{content:'';position:absolute;left:-28px;top:7px;background:#818cf8;width:10px;height:10px;border:2px solid white;border-radius:50%}.event p{white-space:pre-wrap}.modulebar{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.modulebar button{font-size:13px}.summary{display:grid;grid-template-columns:120px 1fr;gap:10px;margin:0}.summary dt{color:var(--muted)}.summary dd{margin:0}details{border:1px solid var(--border);border-radius:7px;background:white;margin-bottom:12px}summary{cursor:pointer;padding:16px;font-weight:600}details .body{padding:0 16px 16px}.document-row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #e2e8f0;padding:12px 0}.preview{white-space:pre-wrap;background:white;border:1px solid #e2e8f0;padding:28px;min-height:240px;font-family:Georgia,serif;line-height:1.8}.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.tabs button[aria-pressed=true]{background:var(--soft);border-color:#818cf8;color:#4338ca}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #e2e8f0;overflow-wrap:anywhere}th{color:var(--muted)}dialog{width:min(760px,calc(100% - 32px));max-height:90dvh;border:1px solid var(--border);border-radius:10px;padding:24px;color:var(--ink)}dialog::backdrop{background:#0f172a80}dialog .close{float:right}.toast{position:fixed;bottom:24px;right:24px;background:#0f172a;color:white;padding:14px 20px;border-radius:8px;max-width:calc(100% - 48px);z-index:5}.toast:empty{display:none}.empty{padding:36px 16px;text-align:center;color:var(--muted)}.file-image{max-width:100%;max-height:280px}.skip{position:absolute;left:-9999px}.skip:focus{left:20px;top:12px;background:white;padding:10px;z-index:9}.print-title{display:none}@media(max-width:1000px){.app{grid-template-columns:180px minmax(0,1fr)}main{padding:24px}.split{grid-template-columns:1fr}.calendar{gap:8px}.column{padding:10px}}@media(max-width:700px){.app{display:block}aside{position:static;height:auto;padding:12px}aside nav{display:flex;flex-wrap:wrap;margin-top:12px}aside nav button{width:auto}.label,.profile{display:none}.brand{padding-bottom:10px}main{padding:24px 16px}.calendar{grid-template-columns:1fr}.top{align-items:flex-start}.summary{grid-template-columns:100px 1fr}.cards{grid-template-columns:1fr}th,td{padding:8px 4px;font-size:11px}}@media print{aside,.notice,.top,.toolbar,.no-print,.toast,dialog{display:none!important}.app{display:block}main{padding:0;max-width:none}.panel{border:0;padding:0}.print-title{display:block}body{background:white;color:black}@page{size:A4;margin:12mm}tr{break-inside:avoid}}
.document-print{display:none}@media print{body.printing-document>.app{display:none!important}body.printing-document>.document-print{display:block;white-space:pre-wrap;font:12pt/1.8 Georgia,serif}}
</style>
</head>
<body>
<a class="skip" href="#content">Ir para o conteúdo</a>
<div class="app"><aside><div class="brand"><span class="logo">HM</span><div><strong>HealthManager</strong><br><small>Clínica Aurora · Demo</small></div></div><nav aria-label="Navegação do protótipo"><div class="label">Rotina</div><button data-page="dashboard">Visão geral</button><button data-page="agenda">Agenda</button><button data-page="patients">Pacientes</button><button data-page="record">Prontuário</button><div class="label">Gestão</div><button data-page="finance">Financeiro</button><button data-page="marketing">Marketing</button><button data-page="search">Busca global</button><div class="label">Administração</div><button data-page="settings">Configurações clínicas</button><button data-page="templates">Modelos de documentos</button><button data-page="profile">Meu perfil</button></nav><div class="profile"><strong>Dra. Helena Costa</strong><br><small>Médica · ambiente demonstrativo</small></div></aside><main id="content" tabindex="-1"><div class="notice">PROTÓTIPO INTERATIVO · Dados fictícios · Alterações temporárias, sem conexão com o sistema</div><div id="view"></div></main></div>
<dialog id="dialog" aria-labelledby="dialog-title"><button class="close" onclick="document.querySelector('dialog').close()" aria-label="Fechar janela">Fechar</button><h2 id="dialog-title"></h2><div id="dialog-body"></div></dialog><div class="toast" role="status" id="feedback"></div>
<script>
'use strict';
const $=s=>document.querySelector(s); const escapeHtml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page='agenda', finalized=false, templateFilter='', selectedFolder='Todas', selectedPatient=0, toastTimer;
const people=['Marina Almeida','Pedro Santos','Beatriz Oliveira'];
const doctors=['Dra. Helena Costa','Dr. Rafael Lima','Dra. Camila Alves'];
const appointments=[{p:0,d:0,time:'08:00',end:'09:00',status:'Em atendimento',type:'Consulta'},{p:1,d:1,time:'08:00',end:'09:00',status:'Confirmada',type:'Retorno'},{p:2,d:0,time:'09:00',end:'10:00',status:'Agendada',type:'Consulta'},{p:1,d:0,time:'09:00',end:'09:30',status:'Confirmada',type:'Retorno'}];
const folders=['Orientações','Declarações','Solicitações'];
const templates=[{title:'Orientações de acompanhamento',folder:'Orientações',scope:'Clínica',doctor:doctors[0],content:'Paciente: {{paciente}}\nData: {{data}}\n\nOrientações individualizadas a serem preenchidas pelo profissional responsável.\n\n{{medico}}'},{title:'Declaração de comparecimento',folder:'Declarações',scope:'Médico',doctor:doctors[0],content:'Declaramos o comparecimento de {{paciente}} à consulta em {{data}}.\n\n{{medico}}'},{title:'Solicitação de avaliação',folder:'Solicitações',scope:'Clínica',doctor:doctors[0],content:'Paciente: {{paciente}}\n\nAvaliação solicitada: [preencher].\nJustificativa: [preencher].\n\n{{medico}}'}];
const drafts=people.map(()=>({}));const records=people.map(()=>[]);const finalStates=people.map(()=>false);
const fieldNames=['Queixa principal','História clínica','Exame físico','Avaliação','Plano'];
const modules=[['prescription','Receituário','Selecionar um modelo e preparar um documento.'],['exams','Exames','Solicitações e resultados do paciente.'],['images','Imagens','Anexos e imagens da consulta.'],['percentiles','Percentis','Medidas e acompanhamento de crescimento.'],['anamnesis','Anamnese','Preencher um formulário clínico.'],['questionnaires','Questionários','Aplicar instrumentos de apoio.'],['foods','Alimentos','Consultar porções e informações nutricionais.'],['telemedicine','Telemedicina','Preparar uma consulta por vídeo.'],['dictation','Evolução assistida','Revisar uma transcrição antes de usar.'],['assistant','Assistente clínico','Explorar perguntas sobre o histórico.']];
function toast(message){$('#feedback').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#feedback').textContent='',4500)}
function openDialog(title,html){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=html;$('#dialog').showModal()}
function header(title,subtitle,actions=''){return `<header class="top"><div><small>Clínica Aurora / ${escapeHtml(page==='settings'||page==='templates'?'Configurações':'Área clínica')}</small><h1>${title}</h1><p class="muted">${subtitle}</p></div><div class="actions">${actions}</div></header>`}
function go(next){if(page==='record')captureDraft();page=next;render();$('#content').focus();window.scrollTo(0,0)}
function captureDraft(){fieldNames.forEach((_,i)=>{const input=$('#clinical-'+i);if(input)drafts[selectedPatient][i]=input.value})}
function selectPatient(index){captureDraft();selectedPatient=index;finalized=finalStates[index];page='record';render();$('#content').focus();window.scrollTo(0,0)}
function moduleButtons(){return `<div class="modulebar">${modules.map(m=>`<button onclick="openModule('${m[0]}')">${m[1]}</button>`).join('')}<button onclick="openModule('all')">Todos os módulos</button></div>`}
function render(){document.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const views={agenda,record,templates:library,settings,report,patients,finance,dashboard,marketing,search,profile};$('#view').innerHTML=(views[page]||agenda)()}
function agenda(){return header('Agenda','Quinta-feira, 22 de outubro de 2026',`<button onclick="go('report')">Imprimir agenda</button><button class="primary" onclick="newAppointment()">Novo agendamento</button>`)+`<div class="toolbar"><label>Data<input type="date" value="2026-10-22" id="agenda-date" onchange="filterAgenda()"></label><label>Profissional<select id="doctor-filter" onchange="filterAgenda()"><option value="">Todos os profissionais</option>${doctors.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select></label><button onclick="openDialog('Confirmações','<p>2 consultas aguardam revisão de confirmação nesta demonstração.</p><p class=muted>Nenhuma mensagem será enviada.</p>')">Confirmações</button></div><p class="muted">Selecione uma consulta para acessar prontuário, cadastro e financeiro.</p><div id="calendar" class="calendar">${calendarColumns('')}</div>`}
function calendarColumns(filter){return doctors.map((doctor,d)=>filter!==''&&Number(filter)!==d?'':`<section class="column"><h2>${doctor}</h2><small>22 out · Clínica Aurora</small>${['08:00','09:00','10:00'].map(time=>`<div class="slot"><small>${time}</small><div class="simultaneous">${appointments.map((a,i)=>a.d===d&&a.time===time?`<button class="appointment" onclick="appointmentActions(${i})"><strong>${people[a.p]}</strong><small>${a.time}–${a.end} · ${a.type}</small><span>${a.status}</span></button>`:'').join('')}</div>${d===2&&time==='08:00'?'<div class="unavailable">Indisponível</div>':''}</div>`).join('')}</section>`).join('')}
function filterAgenda(){$('#calendar').innerHTML=$('#agenda-date').value==='2026-10-22'?calendarColumns($('#doctor-filter').value):'<p class="empty">Sem agendamentos de demonstração nesta data.</p>'}
function appointmentActions(index){const a=appointments[index];openDialog(people[a.p],`<p>${doctors[a.d]} · ${a.time}–${a.end}</p><span class="badge">${a.status}</span><div class="modulebar"><button class="primary" onclick="$('#dialog').close();selectPatient(${a.p})">Abrir prontuário</button><button onclick="$('#dialog').close();go('patients')">Ficha cadastral</button><button onclick="$('#dialog').close();go('finance')">Financeiro do paciente</button></div><label>Status<select id="appointment-status">${['Agendada','Confirmada','Em atendimento','Concluída','Cancelada','Não compareceu'].map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select></label><button onclick="appointments[${index}].status=$('#appointment-status').value;$('#dialog').close();render();toast('Status alterado apenas no protótipo.')">Alterar status</button>`)}
function newAppointment(){openDialog('Novo agendamento',`<form id="new-appointment"><label>Paciente<select name="patient">${people.map((p,i)=>`<option value="${i}">${p}</option>`).join('')}</select></label><label>Profissional<select name="doctor">${doctors.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select></label><label>Horário<select name="time"><option>08:00</option><option>09:00</option><option>10:00</option></select></label><p class="muted">22/10/2026 · duração demonstrativa de 30 minutos.</p><button class="primary">Adicionar à demonstração</button></form>`);$('#new-appointment').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);appointments.push({p:Number(f.get('patient')),d:Number(f.get('doctor')),time:f.get('time'),end:f.get('time').replace(':00',':30'),status:'Agendada',type:'Consulta'});$('#dialog').close();render()}}
function report(){return header('Agenda para impressão','Prévia com dados fictícios',`<button onclick="go('agenda')">Voltar à agenda</button><button class="primary" onclick="window.print()">Imprimir / salvar PDF</button>`)+`<section class="panel"><h1 class="print-title">HealthManager · Agendamentos</h1><h2>Clínica Aurora · 22/10/2026</h2><p>Todos os profissionais · ${appointments.length} agendamentos · Dados fictícios</p><table><thead><tr><th>Horário</th><th>Profissional</th><th>Paciente / prontuário</th><th>Status</th></tr></thead><tbody>${[...appointments].sort((a,b)=>a.time.localeCompare(b.time)).map(a=>`<tr><td>${a.time}–${a.end}</td><td>${doctors[a.d]}</td><td>${people[a.p]}<br><small>DEMO-00${a.p+1} · ${a.type}</small></td><td>${a.status}</td></tr>`).join('')}</tbody></table><p class="muted">Anotações: _______________________________________________________</p></section>`}
function record(){finalized=finalStates[selectedPatient];return header(people[selectedPatient],`Prontuário DEMO-00${selectedPatient+1} · Consulta de 22/10/2026 · Dados fictícios`,`<button onclick="go('agenda')">Voltar à agenda</button><span class="badge ${finalized?'green':''}">${finalized?'Finalizado':'Rascunho'}</span>`)+moduleButtons()+`<div class="split"><div><section class="panel"><h2>Resumo clínico</h2><dl class="summary"><dt>Diagnósticos</dt><dd>Não informado</dd><dt>Antecedentes</dt><dd>Não informado</dd><dt>Medicamentos</dt><dd>Não informado</dd><dt>Alergias</dt><dd>Não informado — confirmar no atendimento</dd><dt>Observações</dt><dd>Resumo longitudinal proposto</dd></dl></section><section class="panel"><h2>Histórico do paciente</h2><label>Buscar no histórico<input id="history-search" type="search" placeholder="Texto, documento ou autor" oninput="filterHistory()"></label><div class="timeline" id="timeline">${historyHtml()}</div></section></div><section class="panel"><h2>${finalized?'Registro finalizado':'Registro da consulta'}</h2><p class="muted">Dra. Helena Costa · 22/10/2026</p>${finalized?`<p class="badge green">Somente leitura · correções por adendo</p>`:''}<form id="clinical-form">${fieldNames.map((name,i)=>`<label>${name}<textarea aria-label="${name}" id="clinical-${i}" ${finalized?'readonly':''} placeholder="Registrar ${name.toLowerCase()}" oninput="captureDraft()">${escapeHtml(drafts[selectedPatient][i]||'')}</textarea></label>`).join('')}<div class="actions">${finalized?'<button type="button" class="primary" onclick="addendum()">Adicionar adendo</button>':'<button type="button" onclick="saveDraft()">Salvar rascunho</button><button type="button" class="primary" onclick="finalizeRecord()">Finalizar prontuário</button>'}</div></form><p class="muted"><small>Finalizar o prontuário não altera automaticamente o status do agendamento.</small></p></section></div>`}
function historyHtml(query=''){const entries=[...records[selectedPatient],{title:'Consulta anterior · 08/10/2026',text:'Registro demonstrativo de acompanhamento. Conteúdo finalizado.',type:'Consulta'},{title:'Documento · 08/10/2026',text:'Orientações de acompanhamento',type:'Documento'}];const result=entries.filter(e=>(e.title+' '+e.text).toLowerCase().includes(query.toLowerCase()));return result.length?result.map(e=>`<article class="event"><small>${escapeHtml(e.title)} · Dra. Helena Costa</small><h3>${escapeHtml(e.type)}</h3><p>${escapeHtml(e.text)}</p>${e.type==='Documento'?'<button onclick="previewTemplate(0)">Ver documento de exemplo</button>':''}</article>`).join(''):'<p class="empty">Nenhum registro encontrado.</p>'}
function filterHistory(){$('#timeline').innerHTML=historyHtml($('#history-search').value)}
function saveDraft(){captureDraft();toast('Rascunho mantido nesta sessão de demonstração.')}
function finalizeRecord(){captureDraft();if(!Object.values(drafts[selectedPatient]).some(v=>v.trim())){toast('Preencha o registro antes de finalizar a demonstração.');return}openDialog('Finalizar prontuário?',`<p>O registro ficará somente para leitura. Correções serão feitas por adendo.</p><button class="primary" id="confirm-finalize">Confirmar finalização</button>`);$('#confirm-finalize').onclick=()=>{finalStates[selectedPatient]=true;records[selectedPatient].unshift({title:'22/10/2026 · Consulta finalizada',text:Object.values(drafts[selectedPatient]).filter(Boolean).join('\n'),type:'Consulta'});$('#dialog').close();render();toast('Prontuário finalizado na demonstração.')}}
function addendum(){openDialog('Adicionar adendo',`<form id="addendum-form"><label>Correção ou complemento<textarea name="text" required></textarea></label><button class="primary">Registrar adendo</button></form>`);$('#addendum-form').onsubmit=e=>{e.preventDefault();const text=new FormData(e.target).get('text').trim();if(!text)return;records[selectedPatient].unshift({title:'22/10/2026 · Adendo',text,type:'Adendo'});$('#dialog').close();render()}}
function settings(){return header('Configurações clínicas','Organize os recursos utilizados durante os atendimentos.')+`<section class="panel"><h2>Documentos e formulários</h2><div class="cards"><button class="card" onclick="go('templates')"><strong>Modelos de documentos</strong><small>Pastas, conteúdo e acesso por clínica ou médico.</small></button>${[['exam-config','Planilha de exames','Unidades e referências do catálogo.'],['food-config','Cadastro de alimentos','Porções e informações nutricionais.'],['form-config','Formulários de anamnese','Campos para organizar a entrevista clínica.'],['question-config','Questionários de apoio','Perguntas, pesos e alertas a definir.']].map(m=>`<button class="card" onclick="openModule('${m[0]}')"><strong>${m[1]}</strong><small>${m[2]}</small></button>`).join('')}</div></section><section class="panel"><h2>Gestão e finanças</h2><p class="muted">A referência não mostra o conteúdo desta seção. Usar os cadastros e permissões já existentes no HealthManager.</p><button onclick="go('finance')">Ver financeiro demonstrativo</button></section>`}
function library(){return header('Modelos de documentos','Conteúdos reutilizáveis, organizados por pasta e proprietário.',`<button onclick="newFolder()">Nova pasta</button><button class="primary" onclick="editTemplate(-1)">Novo modelo</button>`)+`<div class="toolbar"><label>Buscar modelos<input type="search" id="template-search" value="${escapeHtml(templateFilter)}" oninput="templateFilter=this.value;refreshLibrary()" placeholder="Título ou conteúdo"></label><label>Pasta<select id="folder-filter" onchange="selectedFolder=this.value;refreshLibrary()">${['Todas',...folders].map(f=>`<option ${f===selectedFolder?'selected':''}>${escapeHtml(f)}</option>`).join('')}</select></label></div><div id="folders">${folderHtml()}</div>`}
function folderHtml(){return folders.filter(f=>selectedFolder==='Todas'||selectedFolder===f).map(f=>{const items=templates.map((t,i)=>({...t,i})).filter(t=>t.folder===f&&(t.title+' '+t.content).toLowerCase().includes(templateFilter.toLowerCase()));return `<details open><summary>${escapeHtml(f)} <span class="badge">${items.length}</span></summary><div class="body">${items.length?items.map(t=>`<div class="document-row"><div><strong>${escapeHtml(t.title)}</strong><br><small>${t.scope==='Clínica'?'Compartilhado com a clínica':escapeHtml(t.doctor)+' · exclusivo'}</small></div><div class="actions"><button onclick="previewTemplate(${t.i})">Prévia</button><button onclick="editTemplate(${t.i})">Editar</button></div></div>`).join(''):'<p class="muted">Nenhum modelo nesta pasta com os filtros atuais.</p>'}</div></details>`}).join('')}
function refreshLibrary(){$('#folders').innerHTML=folderHtml()}
function newFolder(){openDialog('Nova pasta',`<form id="folder-form"><label>Nome<input name="name" required maxlength="80"></label><button class="primary">Criar pasta</button></form>`);$('#folder-form').onsubmit=e=>{e.preventDefault();const name=new FormData(e.target).get('name').trim();if(!name||folders.includes(name)){toast('Informe um nome de pasta novo.');return}folders.push(name);$('#dialog').close();render()}}
function editTemplate(index){const t=templates[index]||{title:'',folder:folders[0],scope:'Clínica',doctor:doctors[0],content:''};openDialog(index<0?'Novo modelo de documento':'Editar modelo de documento',`<form id="template-form"><label>Título<input name="title" required maxlength="120" value="${escapeHtml(t.title)}"></label><div class="row"><label>Pasta<select name="folder">${folders.map(f=>`<option ${f===t.folder?'selected':''}>${escapeHtml(f)}</option>`).join('')}</select></label><label>Disponível para<select name="scope" onchange="$('#owner-label').hidden=this.value==='Clínica'"><option ${t.scope==='Clínica'?'selected':''}>Clínica</option><option ${t.scope==='Médico'?'selected':''}>Médico</option></select></label></div><label id="owner-label" ${t.scope==='Clínica'?'hidden':''}>Médico proprietário<select name="doctor">${doctors.map(d=>`<option ${d===t.doctor?'selected':''}>${d}</option>`).join('')}</select></label><label>Conteúdo<textarea name="content" required rows="9">${escapeHtml(t.content)}</textarea></label><p class="muted">Variáveis: {{paciente}}, {{medico}}, {{data}}. Editor de texto simples nesta proposta.</p><button class="primary">Salvar modelo</button></form>`);$('#template-form').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(!data.title.trim()||!data.content.trim())return;if(index<0)templates.push(data);else templates[index]=data;$('#dialog').close();render();toast('Modelo salvo nesta sessão.')}}
function previewTemplate(index){const t=templates[index];const content=t.content.replaceAll('{{paciente}}',people[selectedPatient]).replaceAll('{{medico}}',doctors[0]).replaceAll('{{data}}','22/10/2026');if($('#dialog').open)$('#dialog').close();openDialog('Prévia · '+t.title,`<p class="badge">Demonstração · sem assinatura ou validade clínica</p><div class="preview" id="document-preview"><strong>CLÍNICA AURORA</strong>\n\n${escapeHtml(content)}</div><label>Forma de assinatura<select id="signature-method" onchange="updateSignature()"><option value="paper">Manual, em papel</option><option value="digital">Digital integrada</option></select></label><div id="signature-options"></div>`);updateSignature()}
function updateSignature(){const digital=$('#signature-method').value==='digital';$('#signature-options').innerHTML=digital?`<p class="muted">O médico revisa o documento e confirma a assinatura no provedor integrado. Fornecedor ainda a definir.</p><button class="primary" onclick="$('#signature-status').textContent='Simulação: documento encaminhado para confirmação do médico. Nenhuma assinatura digital foi realizada.'">Simular envio para assinatura</button><p id="signature-status" role="status"></p>`:`<p class="muted">Imprima o documento e assine no espaço reservado ao profissional.</p><button class="primary" onclick="printDocument()">Imprimir para assinatura manual</button>`}
function printDocument(){const sheet=document.createElement('div');sheet.className='document-print';sheet.textContent='DEMONSTRAÇÃO — SEM VALIDADE CLÍNICA\n\n'+$('#document-preview').innerText+'\n\n\n________________________________________\n'+doctors[0]+'\nAssinatura e carimbo do profissional';document.body.append(sheet);document.body.classList.add('printing-document');try{window.print()}finally{document.body.classList.remove('printing-document');sheet.remove()}}
function openModule(id){captureDraft();if(id==='all'){openDialog('Ferramentas do atendimento',`<div class="cards">${modules.map(m=>`<button class="card" onclick="$('#dialog').close();openModule('${m[0]}')"><strong>${m[1]}</strong><small>${m[2]}</small></button>`).join('')}</div>`);return}const config=id.endsWith('-config');const titles={'exam-config':'Planilha de exames','food-config':'Cadastro de alimentos','form-config':'Formulários de anamnese','question-config':'Questionários de apoio'};let title=titles[id]||modules.find(m=>m[0]===id)?.[1]||id;let body=`<p class="muted">${config?'Configuração da clínica':escapeHtml(people[selectedPatient])+' · consulta de demonstração'}</p>`;
if(id==='prescription')body+=`<p>Escolha um modelo para preparar o documento do paciente.</p>${templates.filter(t=>t.scope==='Clínica'||t.doctor===doctors[0]).map(t=>`<div class="document-row"><span>${escapeHtml(t.title)}<br><small>${escapeHtml(t.folder)}</small></span><button onclick="previewTemplate(${templates.indexOf(t)})">Usar modelo</button></div>`).join('')}<button onclick="$('#dialog').close();go('templates')">Gerenciar modelos</button>`;
else if(id==='exams'||id==='exam-config')body+=`<div class="tabs"><button onclick="$('#exam-request').hidden=false;$('#exam-results').hidden=true">${config?'Catálogo':'Solicitação'}</button><button onclick="$('#exam-request').hidden=true;$('#exam-results').hidden=false">${config?'Referências':'Resultados'}</button></div><div id="exam-request"><label>Exame<input placeholder="Nome do exame"></label><label>${config?'Unidade':'Indicação / observações'}<input placeholder="Preencher pelo profissional"></label><button onclick="toast('Item registrado apenas para demonstração.')">${config?'Salvar no catálogo':'Adicionar à solicitação'}</button></div><div id="exam-results" hidden><label>${config?'Faixa de referência':'Resultado'}<input placeholder="Não informado"></label><p class="muted">Referências e interpretação dependem de validação clínica. Sem valores de referência fictícios.</p></div>`;
else if(id==='images')body+=`<label>Selecionar imagem ou documento<input id="attachment" type="file" accept="image/*,.pdf" onchange="showAttachment(this)"></label><div id="attachment-preview" class="empty">Nenhum arquivo selecionado. O arquivo permanece no seu navegador.</div>`;
else if(id==='percentiles')body+=`<div class="row"><label>Data da medida<input type="date" value="2026-10-22"></label><label>Peso (kg)<input type="number" min="0" step="0.1"></label><label>Altura (cm)<input type="number" min="0" step="0.1"></label></div><div class="empty">Área de curva de crescimento<br><small>Fonte, faixa etária e curvas a confirmar. Nenhum percentil calculado neste protótipo.</small></div><button onclick="toast('Medidas conferidas na demonstração; sem cálculo clínico.')">Registrar medidas</button>`;
else if(id==='foods'||id==='food-config')body+=`<label>Alimento<input placeholder="Nome do alimento"></label><div class="row"><label>Porção (g)<input type="number" min="0"></label><label>Energia (kcal)<input type="number" min="0"></label></div><div class="row"><label>Carboidratos (g)<input type="number" min="0"></label><label>Proteínas (g)<input type="number" min="0"></label><label>Gorduras (g)<input type="number" min="0"></label></div><label>Restrições / observações<textarea></textarea></label><p class="muted">Base nutricional a definir. Campos vazios não representam valor zero.</p><button onclick="toast('Cadastro demonstrativo conferido.')">${config?'Salvar alimento':'Adicionar ao planejamento'}</button>`;
else if(id==='anamnesis'||id==='questionnaires'||id==='form-config'||id==='question-config')body+=config?`<label>Nome do formulário<input value="Entrevista inicial"></label><div id="questions"><label>Pergunta 1<input placeholder="Texto da pergunta"></label></div><label>Tipo de resposta<select><option>Texto livre</option><option>Sim / não</option><option>Escala</option></select></label><button onclick="addQuestion()">Adicionar pergunta</button><p class="muted">Pesos, alertas e validação do instrumento precisam ser definidos.</p><button onclick="toast('Estrutura do formulário conferida na demonstração.')">Salvar formulário</button>`:`<h3>Entrevista inicial</h3><label>Motivo do acompanhamento<textarea id="interview-answer"></textarea></label><label>Há informações adicionais relevantes?<textarea></textarea></label><p class="muted">Sem pontuação ou alertas clínicos automáticos.</p><button onclick="saveInterview()">Adicionar resposta ao histórico</button>`;
else if(id==='telemedicine')body+=`<div class="empty">Sala de atendimento por vídeo<br><small>Integração ainda não selecionada.</small></div><label>Link da sessão<input type="url" placeholder="https://..."></label><div class="actions"><button onclick="toast('Teste de dispositivos simulado. Nenhuma câmera ou microfone acessado.')">Testar dispositivos</button><button class="primary" onclick="toast('Entrada na sala simulada. Nenhuma chamada iniciada.')">Entrar na sala</button></div>`;
else if(id==='dictation')body+=`<p class="badge amber">Simulação · sem captura de áudio</p><label>Transcrição para revisão<textarea id="transcript" placeholder="Cole um texto de exemplo para revisar"></textarea></label><button onclick="useTranscript()">Usar na história clínica</button><p class="muted">O profissional revisa o texto antes de incorporá-lo ao registro.</p>`;
else if(id==='assistant')body+=`<p class="badge amber">Simulação · sem conexão com IA</p><label>Pergunta sobre o histórico<input id="assistant-question" placeholder="Ex.: quais documentos estão no histórico?"></label><button onclick="$('#assistant-response').textContent='Resposta demonstrativa: consulte os eventos e documentos na linha do tempo. Nenhuma análise clínica foi executada.'">Ver exemplo de resposta</button><p id="assistant-response" role="status"></p>`;
openDialog(title,body)}
function addQuestion(){const wrapper=$('#questions');const label=document.createElement('label');label.textContent='Pergunta '+(wrapper.children.length+1);const input=document.createElement('input');input.placeholder='Texto da pergunta';label.append(input);wrapper.append(label);input.focus()}
function saveInterview(){const text=$('#interview-answer').value.trim();if(!text){toast('Preencha a resposta principal.');return}records[selectedPatient].unshift({title:'22/10/2026 · Formulário',text,type:'Anamnese'});$('#dialog').close();go('record')}
function useTranscript(){const text=$('#transcript').value.trim();if(finalStates[selectedPatient]){toast('Registro finalizado: use um adendo.');return}if(!text){toast('Informe um texto para revisar.');return}drafts[selectedPatient][1]=[drafts[selectedPatient][1],text].filter(Boolean).join('\n');$('#dialog').close();go('record');toast('Texto inserido no rascunho para revisão.')}
function showAttachment(input){const file=input.files[0];const target=$('#attachment-preview');target.replaceChildren();if(!file)return;const caption=document.createElement('p');caption.textContent=file.name+' · somente nesta sessão';target.append(caption);if(file.type.startsWith('image/')){const image=new Image();const url=URL.createObjectURL(file);image.onload=()=>URL.revokeObjectURL(url);image.onerror=()=>URL.revokeObjectURL(url);image.src=url;image.alt='Prévia do arquivo selecionado';image.className='file-image';target.append(image)}}
function patients(){return header('Pacientes','Cadastro e acesso ao histórico clínico.')+`<section class="panel">${people.map((p,i)=>`<div class="document-row"><div><strong>${p}</strong><br><small>DEMO-00${i+1} · cadastro fictício</small></div><button onclick="selectPatient(${i})">Abrir prontuário</button></div>`).join('')}</section>`}
function finance(){return header('Financeiro do paciente','Proposta de acesso contextual aos recebíveis existentes.')+`<section class="panel"><h2>${people[selectedPatient]}</h2><table><thead><tr><th>Descrição</th><th>Vencimento</th><th>Valor</th><th>Situação</th></tr></thead><tbody><tr><td>Consulta · exemplo</td><td>22/10/2026</td><td>R$ 250,00</td><td><span class="badge amber">Pendente</span></td></tr></tbody></table><p class="muted">Demonstrativo. A implementação usará os recebíveis e permissões do financeiro atual.</p><button onclick="toast('Nova cobrança simulada; nenhum recebível foi criado.')">Nova cobrança</button></section>`}
function dashboard(){return header('Visão geral','Acesso à rotina clínica e aos recursos da proposta.')+`<section class="panel"><h2>Agenda de hoje</h2><p>${appointments.length} consultas de demonstração · 3 profissionais</p><button class="primary" onclick="go('agenda')">Abrir agenda</button></section><div class="cards"><button class="card" onclick="go('settings')"><strong>Configurações clínicas</strong><small>Exames, alimentos e formulários.</small></button><button class="card" onclick="go('templates')"><strong>Modelos de documentos</strong><small>Bibliotecas da clínica e do médico.</small></button></div>`}
function marketing(){return header('Marketing','Esboço do atalho visível na referência.')+`<section class="panel"><h2>Comunicação com pacientes</h2><label>Nome da campanha<input placeholder="Ex.: lembrete de acompanhamento"></label><label>Mensagem<textarea placeholder="Texto da comunicação"></textarea></label><p class="muted">Público, consentimento e canais a definir. Conteúdo do prontuário não alimenta campanhas automaticamente.</p><button onclick="toast('Rascunho demonstrativo conferido. Nenhuma mensagem enviada.')">Revisar rascunho</button></section>`}
function search(){return header('Busca global','Encontre destinos deste protótipo.')+`<section class="panel"><label>Buscar<input type="search" oninput="searchDestinations(this.value)" placeholder="Agenda, pacientes, modelos..."></label><div id="search-results"></div></section>`}
function searchDestinations(query){const list=[['agenda','Agenda'],['patients','Pacientes'],['templates','Modelos de documentos'],['settings','Configurações clínicas'],['record','Prontuário']].filter(x=>x[1].toLowerCase().includes(query.toLowerCase()));$('#search-results').innerHTML=list.length?list.map(x=>`<div class="document-row"><span>${x[1]}</span><button onclick="go('${x[0]}')">Abrir</button></div>`).join(''):'<p>Nenhum resultado.</p>'}
function profile(){return header('Meu perfil','Identificação do profissional no ambiente demonstrativo.')+`<section class="panel"><h2>Dra. Helena Costa</h2><p>Médica · Clínica Aurora</p><p class="muted">Preferências e gerenciamento de conta devem seguir a autenticação existente.</p><button onclick="go('templates')">Meus modelos e modelos da clínica</button></section>`}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));render();
</script>
</body></html>
