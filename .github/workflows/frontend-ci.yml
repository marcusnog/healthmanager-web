name: frontend-ci

on:
  push:
    branches: ["master", "main", "develop"]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ""

  deploy:
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    timeout-minutes: 20
    concurrency:
      group: frontend-production
      cancel-in-progress: false
    env:
      IMAGE: localhost/healthmanager-web:${{ github.sha }}-k3s
      RELEASE: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build -t "$IMAGE" .
          docker save "$IMAGE" | gzip > /tmp/web-image.tar.gz

      - name: Configure VPS access
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_SSH_KEY" || { echo "Missing repository secret: VPS_SSH_KEY" >&2; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "Missing repository secret: VPS_KNOWN_HOSTS" >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload image
        run: scp /tmp/web-image.tar.gz "root@157.254.207.208:/tmp/healthmanager-web-$RELEASE.tar.gz"

      - name: Deploy and verify
        run: |
          ssh root@157.254.207.208 bash -s -- "$RELEASE" <<'REMOTE'
          set -euo pipefail
          release="$1"
          archive="/tmp/healthmanager-web-$release.tar.gz"
          trap 'rm -f -- "$archive"' EXIT
          k3s ctr images import "$archive"
          k3s kubectl -n healthmanager set image deployment/web "web=localhost/healthmanager-web:$release-k3s"
          if ! k3s kubectl -n healthmanager rollout status deployment/web --timeout=120s ||
             ! curl --fail --silent --show-error http://127.0.0.1:8081/ > /dev/null; then
            k3s kubectl -n healthmanager rollout undo deployment/web
            k3s kubectl -n healthmanager rollout status deployment/web --timeout=120s
            exit 1
          fi
          REMOTE
