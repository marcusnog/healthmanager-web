<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protótipo — Agenda</title><style>body{font:14px Arial;margin:32px;background:#f6f7f8;color:#202126}main{max-width:1100px;margin:auto;background:white;padding:24px;border:1px solid #ddd;border-radius:8px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:20px}button{padding:10px 16px;border:1px solid #ddd;background:white;border-radius:4px}.scroll{height:650px;overflow:auto;border:1px solid #ddd}.grid{display:grid;grid-template-columns:64px repeat(2,minmax(240px,1fr));min-width:640px}.head{padding:16px;border-bottom:1px solid #ccc;position:sticky;top:0;background:white;z-index:2}.ruler,.column{height:1500px;position:relative}.column{border-left:1px solid #ccc;background:repeating-linear-gradient(to bottom,transparent 0 49px,#eee 49px 50px)}.time{position:absolute;right:10px;font-size:12px}.event{position:absolute;box-sizing:border-box;background:#ec00ef;border:1px solid #b900c5;padding:8px;color:#231027;overflow:auto;border-radius:2px;font-size:12px;line-height:1.4}.event strong,.event span{display:block}.note{color:#666;font-size:12px}</style><main><header><h1>Agenda · 30 setembro 2026</h1><button>Dia</button></header><p class="note">Protótipo visual · dados fictícios · clique na consulta para ver os detalhes</p><div class="scroll"><div class="grid"><div class="head">Horário</div><div class="head">Dra. Ana · Clínica geral</div><div class="head">Dr. Pedro · Clínica geral</div><div class="ruler" id="ruler"></div><div class="column"><button class="event" style="top:150px;height:200px;left:4px;width:calc(50% - 6px)" onclick="alert(this.innerText)"><strong>ⓘ Marina Oliveira</strong><span>Prontuário P-DEMO001</span><span>(11) 99999-0001</span><span>09:00 – 10:20</span><span>Agendado</span></button><button class="event" style="top:150px;height:200px;left:calc(50% + 2px);width:calc(50% - 6px)" onclick="alert(this.innerText)"><strong>ⓘ Lucas Santos</strong><span>Prontuário P-DEMO002</span><span>(11) 99999-0002</span><span>09:00 – 10:20</span><span>Confirmado</span></button></div><div class="column"><button class="event" style="top:350px;height:100px;left:4px;right:4px" onclick="alert(this.innerText)"><strong>ⓘ Beatriz Costa</strong><span>10:20 – 11:00</span><span>Agendado</span></button></div></div></div></main><script>for(let m=0;m<600;m+=20){let s=document.createElement('span');s.className='time';s.style.top=(m*2.5+4)+'px';s.textContent=String(8+Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');document.querySelector('#ruler').append(s)}</script></html>
